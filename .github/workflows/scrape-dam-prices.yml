name: Scrape DAM Market Prices

on:
  schedule:
    # Run at 8:00 AM and 4:00 PM Bangladesh Standard Time (UTC+6)
    # 8:00 AM BST  = 2:00 AM UTC
    # 4:00 PM BST = 10:00 AM UTC
    - cron: '0 2 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run market price scraper
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/scrape_dam_prices.mjs
