    <script>
      // Polyfill/shim for environments (e.g. sandboxed iframes) where window.fetch has only a getter
      (function () {
        function ensureFetchSetter(target) {
          try {
            if (!target) return;
            var currentFetch = target.fetch;
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (!desc || !desc.set || !desc.writable) {
              Object.defineProperty(target, 'fetch', {
                get: function () {
                  return currentFetch;
                },
                set: function (newFetch) {
                  currentFetch = newFetch;
                },
                configurable: true,
                enumerable: true,
              });
            }
          } catch (e) {}
        }
        ensureFetchSetter(window);
        if (typeof Window !== 'undefined' && Window.prototype) {
          ensureFetchSetter(Window.prototype);
        }
      })();
    </script>

    <script>
      // Register service worker with safe iframe and environment detection
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', async () => {
          // If loaded inside an iframe (e.g., AI Studio preview container),
          // unregister any existing service workers to prevent cross-frame caching and update errors
          if (window.self !== window.top) {
            try {
              const registrations = await navigator.serviceWorker.getRegistrations();
              for (const reg of registrations) {
                await reg.unregister();
              }
            } catch (_) {}
            return;
          }

          try {
            const registration = await navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' });
            if (registration) {
              registration.addEventListener('updatefound', () => {
                const installingWorker = registration.installing;
                if (installingWorker) {
                  installingWorker.addEventListener('statechange', () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.info('Plant Detective: Update ready');
                    }
                  });
                }
              });
            }
          } catch (err) {
            console.warn('Service worker registration bypassed:', err?.message || err);
          }
        });
      }
    </script>
